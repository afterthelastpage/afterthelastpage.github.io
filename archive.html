<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Archive — afterthelastpage</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=IM+Fell+English:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="page-bg">

  <header>
    <div class="monogram">a<sup>/</sup>e</div>
    <a href="index.html" style="text-decoration:none;"><h1 class="site-title">afterthelastpage</h1></a>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="archive.html">Archive</a>
    <a href="about.html">About</a>
  </nav>

  <div class="simple-page">
    <h2>Archive</h2>
    <ul class="archive-list" id="archive-list">
      <!-- Populated by books.js -->
    </ul>
  </div>

</div>
<script src="js/books.js"></script>
<script>
  const list = document.getElementById('archive-list');
  BOOKS.forEach(book => {
    const li = document.createElement('li');
    li.innerHTML = `
      <a href="${book.file}">${book.title}</a>
      <span class="arch-meta">${book.category} · ${book.date}</span>
    `;
    list.appendChild(li);
  });
</script>
</body>
</html>
